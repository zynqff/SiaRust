name: Build GuardLib for iOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Install iOS targets
        run: |
          rustup target add aarch64-apple-ios
          rustup target add aarch64-apple-ios-sim
          rustup target add x86_64-apple-ios

      - name: Build iOS device library
        run: cargo build --release --target aarch64-apple-ios

      - name: Build iOS simulator libraries
        run: |
          cargo build --release --target aarch64-apple-ios-sim
          cargo build --release --target x86_64-apple-ios

      - name: Prepare clean workspace
        run: |
          mkdir -p xcframework_work/device
          mkdir -p xcframework_work/simulator
          mkdir -p xcframework_work/headers
          cp guardlib.h xcframework_work/headers/
          cp target/aarch64-apple-ios/release/libguardlib.a xcframework_work/device/
          lipo -create \
            target/aarch64-apple-ios-sim/release/libguardlib.a \
            target/x86_64-apple-ios/release/libguardlib.a \
            -output xcframework_work/simulator/libguardlib.a

      - name: Create XCFramework
        run: |
          cd xcframework_work
          xcodebuild -create-xcframework \
            -library device/libguardlib.a -headers headers \
            -library simulator/libguardlib.a -headers headers \
            -output GuardLib.xcframework

      - name: Copy result to dist
        run: |
          mkdir -p dist/ios
          mv xcframework_work/GuardLib.xcframework dist/ios/
          cp guardlib.h dist/ios/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: guardlib-ios
          path: dist/ios/